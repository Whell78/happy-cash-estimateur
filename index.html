<script>
// On définit une valeur de base réaliste au cas où l'API est temporairement indisponible
let goldPrice24k = 75.50; 
let selectedCarat = 18;
let selectedState = 0;

async function fetchGoldPrice() {
  try {
    const response = await fetch('https://api.metals.live/v1/spot/gold');
    const data = await response.json();
    
    // Gestion robuste de la réponse (tableau ou objet)
    let priceUSD = 0;
    if (Array.isArray(data) && data[0] && data[0].gold) {
      priceUSD = data[0].gold;
    } else if (data && data.gold) {
      priceUSD = data.gold;
    }

    if (priceUSD > 0) {
      const eurUSD = 1.09; // Taux de change EUR/USD
      const priceEUR = priceUSD / eurUSD;
      goldPrice24k = priceEUR / 31.1035; // Conversion Once -> Gramme 24K
      
      document.getElementById('headerPrice').textContent = goldPrice24k.toFixed(2) + '€';
      
      // On force la mise à jour immédiate des calculs avec le nouveau cours reçu
      updateEstimation();
    }
  } catch (error) {
    console.error("Erreur de récupération du cours :", error);
    document.getElementById('headerPrice').textContent = goldPrice24k.toFixed(2) + '€';
  }
}

function selectCarat(carat, element) {
  selectedCarat = carat;
  document.querySelectorAll('.carat-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
  updateEstimation();
}

function selectState(state, element) {
  selectedState = state;
  document.querySelectorAll('.state-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
  updateEstimation();
}

function updateEstimation() {
  const weight = parseFloat(document.getElementById('weight').value) || 0;
  const unit = document.getElementById('unit').value;
  const isPoincon = document.getElementById('poincon').checked;
  const hasStones = document.getElementById('stones').checked;
  
  let weightGrams = unit === 'g' ? weight : weight * 0.1;
  
  if (weightGrams <= 0) {
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('adjustmentHint').style.display = 'none';
    return;
  }
  
  // CORRECTION : On calcule le prix fondeur en direct selon le cours 24K live
  // 18K = (18/24) du prix pur, 22K = (22/24), etc.
  const currentFounderPrice = goldPrice24k * (selectedCarat / 24);
  
  // Marge Happy Cash : 21.9% si poinçon, 25% sans poinçon
  const baseMarginPercent = isPoincon ? 0.219 : 0.25;
  
  let totalAdjustment = 0;
  let adjustmentText = [];
  
  if (selectedState !== 0) {
    totalAdjustment += selectedState;
    const stateLabels = { "-2": "Léger", "-3": "Endommagé", "-5": "Très abîmé" };
    adjustmentText.push(stateLabels[selectedState.toString()]);
  }
  
  if (hasStones) {
    totalAdjustment -= 2;
    adjustmentText.push('Pierres précieuses');
  }
  
  const adjustmentMultiplier = 1 + (totalAdjustment / 100);
  
  // Formule finale parfaitement synchronisée avec le cours du marché
  const finalPrice = currentFounderPrice * weightGrams * (1 - baseMarginPercent) * adjustmentMultiplier;
  
  document.getElementById('resultPrice').textContent = finalPrice.toFixed(2) + '€';
  
  const caratLabel = selectedCarat + 'K';
  const poinconText = isPoincon ? 'poinçonné' : 'non poinçonné';
  document.getElementById('resultDesc').textContent = 
    `${weightGrams.toFixed(1)}g d'or ${caratLabel} ${poinconText}`;
  
  if (adjustmentText.length > 0) {
    document.getElementById('adjustmentText').textContent = adjustmentText.join(', ');
    document.getElementById('adjustmentHint').style.display = 'block';
  } else {
    document.getElementById('adjustmentHint').style.display = 'none';
  }
  
  document.getElementById('resultCard').classList.add('show');
}

function goToShop() {
  window.open('https://share.google/W2dojqoBqSOGWY0m9', '_blank');
}

// Premier appel au chargement de la page
fetchGoldPrice();
// Mise à jour automatique toutes les 2 minutes pour rester "Live"
setInterval(fetchGoldPrice, 120000);
</script>
